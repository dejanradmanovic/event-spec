name: CI - Swift SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdk/swift/**'
      - '.github/workflows/ci-swift.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdk/swift/**'
      - '.github/workflows/ci-swift.yml'

permissions:
  contents: read

jobs:
  swift:
    name: Swift SDK
    runs-on: macos-latest
    defaults:
      run:
        working-directory: sdk/swift

    steps:
      - uses: actions/checkout@v7

      - name: Toolchain version
        run: swift --version

      # `swift format` is a toolchain subcommand only on recent Swift releases; fall
      # back to a standalone `swift-format` on PATH, and install it if neither is there.
      - name: Format check
        run: |
          if swift format --version >/dev/null 2>&1; then
            swift format lint --strict --recursive Sources Tests
          else
            if ! command -v swift-format >/dev/null 2>&1; then
              brew install swift-format
            fi
            swift-format lint --strict --recursive Sources Tests
          fi

      - name: Build
        run: swift build

      - name: Test
        run: swift test
