<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>event-spec · software factory</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --line: #e2e1dc; --ink: #1c1b19; --mute: #6f6d66;
    --pass: #2f7d4f; --pass-bg: #e8f3ea; --chg: #a55b06; --chg-bg: #fcf0de;
    --pend: #9b9890; --pend-bg: #f1f0ed; --flag: #b4341f; --flag-bg: #fdeeea;
    --accent: #3b5bdb; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a; --panel: #1e1e23; --line: #32323a; --ink: #e9e8e4; --mute: #9b988f;
      --pass: #6fcf8e; --pass-bg: #1d2f24; --chg: #e2a33c; --chg-bg: #33280f;
      --pend: #76736c; --pend-bg: #26262c; --flag: #f0796a; --flag-bg: #351c1a;
      --accent: #8ca2ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 20px 24px 14px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  h1 span { color: var(--mute); font-weight: 400; }
  .meta { margin-left: auto; color: var(--mute); font: 12px/1 var(--mono);
    display: flex; align-items: center; gap: 14px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--pass); margin-right: 6px; vertical-align: middle; }
  .dot.stale { background: var(--pend); }

  main { padding: 18px 24px 40px; }
  .lane { margin-bottom: 22px; border: 1px solid var(--flag); background: var(--flag-bg);
    border-radius: 10px; padding: 12px 14px; }
  .lane h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--flag); }
  .lane .cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .lane .card { flex: 1 1 320px; max-width: 460px; }

  .queue { margin-bottom: 20px; }
  .queue h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--mute); }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { background: var(--panel); border: 1px dashed var(--line); border-radius: 999px;
    padding: 5px 12px; font: inherit; font-size: 12px; color: var(--mute);
    cursor: pointer; }
  .pill:hover { border-color: var(--accent); color: var(--ink); }
  .pill b { font: 11px var(--mono); color: var(--ink); font-weight: 400; }

  .pipe { display: grid; grid-template-columns: repeat(5, minmax(190px, 1fr));
    gap: 12px; overflow-x: auto; padding-bottom: 6px; }
  .col { min-width: 190px; }
  .col > h2 { margin: 0 0 9px; font-size: 11px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--mute); display: flex; gap: 6px; }
  .col > h2 b { color: var(--ink); font-weight: 600; }
  .col .drop { min-height: 56px; border: 1px dashed var(--line); border-radius: 10px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 12px; margin-bottom: 10px; text-align: left;
    width: 100%; color: inherit; font: inherit; display: block;
    transition: border-color .12s, transform .12s; }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .cardmain { display: block; width: 100%; padding: 0; border: none; background: none;
    text-align: left; color: inherit; font: inherit; cursor: pointer; }
  .cardmain:focus-visible, a.card:focus-visible { outline: 2px solid var(--accent);
    outline-offset: 2px; }
  .card .id { font: 11px var(--mono); color: var(--mute); }
  .card .title { font-weight: 600; margin: 2px 0 4px; }
  .card .branch { font: 11px var(--mono); color: var(--mute);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .note { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--flag); }

  .round { display: flex; align-items: center; gap: 4px; margin-top: 7px; }
  .round .rn { font: 10px var(--mono); color: var(--mute); width: 20px; flex: none; }
  .round.past { opacity: .55; }
  .chip { font: 10px/1 var(--mono); padding: 4px 5px; border-radius: 5px; flex: 1;
    text-align: center; border: 1px solid transparent; }
  .chip.PASS { color: var(--pass); background: var(--pass-bg); border-color: var(--pass); }
  .chip.CHANGES { color: var(--chg); background: var(--chg-bg); border-color: var(--chg); }
  .chip.pending { color: var(--pend); background: var(--pend-bg);
    border: 1px dashed var(--pend); }
  .blocked { margin-top: 7px; font: 11px var(--mono); color: var(--chg);
    background: var(--chg-bg); border-radius: 5px; padding: 4px 6px; }
  .empty { color: var(--mute); font-size: 13px; padding: 10px 2px; }

  /* backlog and shipped rails */
  .rail { margin-bottom: 22px; }
  .rail > h2 { margin: 0 0 9px; font-size: 11px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--mute);
    display: flex; align-items: center; gap: 8px; }
  .rail > h2 b { color: var(--ink); font-weight: 600; }
  .rail > h2 .hint { text-transform: none; letter-spacing: 0; font: 11px var(--mono); }
  .toggle { margin-left: auto; display: flex; gap: 4px; }
  .toggle button { font: 10px var(--mono); padding: 3px 8px; border-radius: 5px;
    border: 1px solid var(--line); background: none; color: var(--mute); cursor: pointer; }
  .toggle button[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); }

  .rows { background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 12px;
    border-top: 1px solid var(--line); }
  .row:first-child { border-top: none; }
  .row:hover { background: var(--bg); }
  .row .num { font: 11px var(--mono); color: var(--accent); width: 46px; flex: none;
    text-decoration: none; }
  .row .rt { flex: 1; min-width: 0; color: inherit; text-decoration: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .rt:hover { text-decoration: underline; }
  .row .tags { display: flex; gap: 5px; flex: none; flex-wrap: wrap; justify-content: flex-end; }
  .tag { font: 10px/1.5 var(--mono); color: var(--mute); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 8px; background: none; }
  .tag.ms { border-style: dashed; }
  .tag.on { color: var(--pass); border-color: var(--pass); background: var(--pass-bg);
    cursor: pointer; font-family: var(--mono); }
  .tag.soft { border-style: dashed; opacity: .75; }
  .tag.t-blocked, .tag.t-epic { color: var(--chg); border-color: var(--chg);
    background: var(--chg-bg); }
  .tag.t-groom { color: var(--mute); background: var(--pend-bg); }

  .grouphead { display: flex; align-items: baseline; gap: 8px; padding: 9px 12px 5px;
    border-top: 1px solid var(--line); background: var(--bg); }
  .row + .grouphead { margin-top: 2px; }
  .rows > .grouphead:first-child { border-top: none; }
  .grouphead b { font: 11px var(--mono); letter-spacing: .04em; text-transform: uppercase; }
  .grouphead span { font: 10px var(--mono); color: var(--mute); }
  .grouphead em { font: normal 11px/1.4 var(--mono); color: var(--mute);
    margin-left: auto; text-align: right; }
  .t-ready { color: var(--pass); }
  .t-blocked, .t-epic { color: var(--chg); }
  .t-unlabelled { color: var(--accent); }
  .t-groom { color: var(--mute); }

  .shipcards { display: flex; gap: 12px; flex-wrap: wrap; }
  .shipcards .card { flex: 1 1 300px; max-width: 430px; margin: 0; text-decoration: none; }
  .card .pr { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line);
    font: 11px var(--mono); color: var(--mute); }
  .card .pr.follow { color: var(--mute); }
  .card .pr.follow a { color: var(--accent); text-decoration: none; }
  .card .pr.follow a:hover { text-decoration: underline; }
  .card .pr .n { color: var(--pass); text-decoration: none; }
  .card .pr a.n:hover { text-decoration: underline; }
  .card .pr .when { margin-left: auto; }
  .card .pr .add { color: var(--pass); }
  .card .pr .del { color: var(--flag); }
  .checks { font: 10px/1.5 var(--mono); border-radius: 5px; padding: 2px 6px; }
  .checks.passing { color: var(--pass); background: var(--pass-bg); }
  .checks.failing { color: var(--flag); background: var(--flag-bg); }
  .checks.running { color: var(--chg); background: var(--chg-bg); }
  .checks.none, .checks.UNKNOWN, .checks.CONFLICTING { color: var(--mute); background: var(--pend-bg); }
  .checks.CONFLICTING { color: var(--chg); background: var(--chg-bg); }
  .ghwarn { font: 11px var(--mono); color: var(--chg); background: var(--chg-bg);
    border-radius: 6px; padding: 6px 9px; margin: 0 0 12px; }

  #scrim { position: fixed; inset: 0; background: #0006; opacity: 0; pointer-events: none;
    transition: opacity .15s; }
  #scrim.open { opacity: 1; pointer-events: auto; }
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100%);
    background: var(--panel); border-left: 1px solid var(--line);
    transform: translateX(100%); transition: transform .18s ease-out;
    display: flex; flex-direction: column; }
  #drawer.open { transform: none; }
  #drawer header { padding: 16px 18px 12px; }
  #drawer h1 { font: 13px var(--mono); }
  #dMeta { font: 11px var(--mono); color: var(--mute); margin-top: 4px;
    word-break: break-all; }
  #dMeta a { color: var(--accent); }
  #close { margin-left: auto; background: none; border: 1px solid var(--line);
    color: var(--mute); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
  #tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 18px;
    border-bottom: 1px solid var(--line); }
  #tabs button { font: 11px var(--mono); padding: 4px 8px; border-radius: 6px;
    border: 1px solid var(--line); background: none; color: var(--mute); cursor: pointer; }
  #tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
  #doc { padding: 18px; overflow: auto; flex: 1; }
  #doc h1, #doc h2, #doc h3 { margin: 1.3em 0 .5em; font-size: 14px; }
  #doc h1 { font-size: 16px; margin-top: 0; }
  #doc h3 { color: var(--mute); }
  #doc pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; font: 12px/1.5 var(--mono); }
  #doc code { font: 12px var(--mono); background: var(--bg); padding: 1px 4px;
    border-radius: 4px; }
  #doc pre code { background: none; padding: 0; }
  #doc table { border-collapse: collapse; font: 12px var(--mono); margin: .6em 0; }
  #doc th, #doc td { border: 1px solid var(--line); padding: 4px 9px; text-align: left; }
  #doc li { margin: .2em 0; }
  #doc a { color: var(--accent); }
  .badge { display: inline-block; font: 11px/1 var(--mono); padding: 5px 8px;
    border-radius: 6px; margin-bottom: 14px; }
  .badge.good { color: var(--pass); background: var(--pass-bg); }
  .badge.bad { color: var(--chg); background: var(--chg-bg); }
</style>
</head>
<body>

<header>
  <h1>event-spec <span>· software factory</span></h1>
  <div class="meta"><span id="counts"></span><span id="status"><span class="dot"></span>connecting…</span></div>
</header>

<main>
  <p class="ghwarn" id="ghwarn" hidden></p>

  <section class="lane" id="lane" hidden>
    <h2>needs human — /factory approve &lt;id&gt; · /factory rework &lt;id&gt; &lt;note&gt;</h2>
    <div class="cards" id="laneCards"></div>
  </section>

  <section class="rail" id="backlog" hidden>
    <h2>
      <b>backlog</b> <span class="hint" id="backlogHint"></span>
      <span class="toggle" id="tierFilter"></span>
    </h2>
    <div class="rows" id="backlogRows"></div>
  </section>

  <section class="queue" id="queue" hidden>
    <h2>queued — on the board, waiting for a slot</h2>
    <div class="pills" id="queuePills"></div>
  </section>

  <div class="pipe" id="pipe"></div>

  <section class="rail" id="shipped" hidden style="margin-top:22px">
    <h2>
      <b>shipped</b> <span class="hint">merged on GitHub</span>
      <span class="toggle" id="shipToggle">
        <button data-scope="factory">factory</button>
        <button data-scope="all">all</button>
      </span>
    </h2>
    <div class="shipcards" id="shippedCards"></div>
  </section>

  <p class="empty" id="empty" hidden>No jobs yet. Run <code>/factory &lt;feature&gt;</code> or <code>/factory next</code>.</p>
</main>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true">
  <header>
    <div><h1 id="dTitle"></h1><div id="dMeta"></div></div>
    <button id="close">esc</button>
  </header>
  <div id="tabs"></div>
  <div id="doc"></div>
</aside>

<script>
const STAGES = [
  ['spec',     'spec',     'spec-writer'],
  ['build',    'build',    'builder'],
  ['review',   'review',   '4 reviewers'],
  ['decision', 'decision', 'approver'],
  ['pr-open',  'PR open',  'awaiting human merge'],
];
const REVIEWERS = ['security', 'ux', 'ui', 'code'];
const IN_FLIGHT = ['spec', 'build', 'review', 'decision'];
let board = { jobs: [] }, open = null;

/* GitHub truth: the ready-for-dev backlog, and which PRs actually merged.
   Served by serve.py, which shells out to `gh`. Under plain `python -m
   http.server` this is the last snapshot serve.py mirrored to disk. */
let gh = { backlog: [], merged: [], openPRs: [] };
let shipScope = 'factory';

/* ---------- polling ---------- */

async function poll() {
  try {
    const r = await fetch('board.json?t=' + Date.now(), { cache: 'no-store' });
    board = await r.json();
    render();
    setStatus(true, board.updated);
  } catch (e) {
    setStatus(false, 'board.json unreachable');
  }
  setTimeout(poll, 2000);
}

/* gh costs a round trip to GitHub, so this loop is slow on purpose; serve.py
   caches for 60s behind it. The board keeps updating every 2s regardless. */
async function pollGitHub() {
  try {
    const r = await fetch('github.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) { gh = await r.json(); render(); setStatus(true, board.updated); }
  } catch (e) { /* keep the last snapshot */ }
  setTimeout(pollGitHub, 60000);
}

function setStatus(ok, when) {
  const bits = [`<span class="dot${ok ? '' : ' stale'}"></span>` +
    (ok ? (when ? 'board ' + new Date(when).toLocaleTimeString() : 'idle') : when)];
  if (gh.fetched) bits.push('gh ' + new Date(gh.fetched).toLocaleTimeString());
  document.getElementById('status').innerHTML = bits.join(' · ');
}

/* ---------- joining the board to GitHub ---------- */

const byBranch = (list, job) =>
  (job.branch && (list || []).find(p => p.branch === job.branch)) || null;
const mergedPR = job => byBranch(gh.merged, job);
const openPR = job => byBranch(gh.openPRs, job);

/* A job is shipped when GitHub says its branch merged - whatever the board
   still thinks. That is the point: the board records what the factory did, and
   merging is the one step the factory never does. */
const isShipped = job => !!mergedPR(job) || job.stage === 'merged';

function ago(iso) {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 90) return 'just now';
  if (s < 5400) return Math.round(s / 60) + 'm ago';
  if (s < 172800) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}

function render() {
  const jobs = board.jobs || [];
  const live = jobs.filter(j => !isShipped(j));

  const working = live.filter(j => IN_FLIGHT.includes(j.stage) && !j.blockedBy).length;
  const blocked = live.filter(j => IN_FLIGHT.includes(j.stage) && j.blockedBy).length;
  const queued = live.filter(j => j.stage === 'queued');
  const shipped = jobs.filter(isShipped);
  const factoryMerged = (gh.merged || []).filter(p => p.factory);
  document.getElementById('counts').textContent =
    `${working}/${board.cap || 3} in flight`
    + (blocked ? ` · ${blocked} blocked` : '')
    + (queued.length ? ` · ${queued.length} queued` : '')
    + ((gh.backlog || []).length
      ? ` · ${(gh.tiers || {}).ready || 0}/${gh.backlog.length} issues ready` : '')
    + (factoryMerged.length ? ` · ${factoryMerged.length} shipped` : '');

  renderBacklog(jobs);
  renderShipped(shipped, factoryMerged);

  /* Say so when the backlog and the merge list are not live, rather than let
     them read as current. Served statically, github.json never refreshes. */
  const age = gh.fetched ? (Date.now() - new Date(gh.fetched)) / 60000 : null;
  const warn = document.getElementById('ghwarn');
  warn.hidden = !(gh.error || (age !== null && age > 10));
  if (!warn.hidden) {
    const when = gh.fetched ? new Date(gh.fetched).toLocaleString() : 'never fetched';
    warn.textContent = (gh.error ? `GitHub unavailable (${gh.error})` : 'GitHub data is stale')
      + ` — the backlog and merged PRs are a snapshot from ${when}.`
      + ' For live data serve the dashboard with: python factory/serve.py';
  }

  document.getElementById('queue').hidden = !queued.length;
  document.getElementById('queuePills').replaceChildren(...queued.map(j => {
    const b = document.createElement('button');
    b.className = 'pill';
    b.onclick = () => openJob(j);
    b.innerHTML = `<b>${esc(j.id)}</b> ${esc(j.title || '')}`;
    return b;
  }));

  const flagged = live.filter(j => j.stage === 'needs-human');
  const lane = document.getElementById('lane');
  lane.hidden = !flagged.length;
  document.getElementById('laneCards').replaceChildren(...flagged.map(card));

  const pipe = document.getElementById('pipe');
  pipe.replaceChildren(...STAGES.map(([stage, label, who]) => {
    const col = document.createElement('div');
    col.className = 'col';
    const head = document.createElement('h2');
    head.innerHTML = `<b>${label}</b> ${who}`;
    const here = live.filter(j => j.stage === stage);
    const body = document.createElement('div');
    if (here.length) body.replaceChildren(...here.map(card));
    else body.className = 'drop';
    col.append(head, body);
    return col;
  }));

  document.getElementById('empty').hidden = jobs.length > 0;
}

/* ---------- the backlog (GitHub, not the board) ---------- */

/* Every open issue, bucketed. `ready` is exactly what /factory next will take;
   the other four are the grooming work, and each says why it is not ready. */
const TIERS = [
  ['ready', 'ready', 'what /factory next picks up, lowest number first'],
  ['blocked', 'blocked', 'the issue itself says something must land first'],
  ['unlabelled', 'not labelled', 'reads complete, but never marked ready-for-dev'],
  ['groom', 'needs grooming', 'missing what a spec-writer needs to build from'],
  ['epic', 'epic', 'split into one issue per deliverable before opening a job'],
];
const MISSING_LABEL = { goal: 'goal', files: 'file list', criteria: 'acceptance criteria' };
let tierFilter = 'all';

function renderBacklog(jobs) {
  const rows = gh.backlog || [];
  const counts = gh.tiers || {};
  document.getElementById('backlog').hidden = !rows.length;
  document.getElementById('backlogHint').textContent = rows.length
    ? `${rows.length} open issue${rows.length === 1 ? '' : 's'} · ${counts.ready || 0} ready to build`
    : '';

  const filters = document.getElementById('tierFilter');
  const shown = TIERS.filter(([k]) => counts[k]);
  filters.replaceChildren(...[['all', 'all', 'every open issue']].concat(shown).map(([k, label, hint]) => {
    const b = document.createElement('button');
    b.textContent = k === 'all' ? `all (${rows.length})` : `${label} (${counts[k]})`;
    b.title = hint;
    b.setAttribute('aria-pressed', tierFilter === k);
    b.onclick = () => { tierFilter = k; render(); };
    return b;
  }));

  const onBoard = new Map(jobs.filter(j => j.issue).map(j => [j.issue, j]));
  const out = [];
  for (const [tier, label, hint] of TIERS) {
    const here = rows.filter(i => i.tier === tier
      && (tierFilter === 'all' || tierFilter === tier));
    if (!here.length) continue;
    if (tierFilter === 'all') {
      const h = document.createElement('div');
      h.className = 'grouphead';
      h.innerHTML = `<b class="t-${tier}">${esc(label)}</b> <span>${here.length}</span>`
        + `<em>${esc(hint)}</em>`;
      out.push(h);
    }
    out.push(...here.map(i => backlogRow(i, onBoard.get(i.number))));
  }
  document.getElementById('backlogRows').replaceChildren(...out);
}

function backlogRow(issue, job) {
  const row = document.createElement('div');
  row.className = 'row';
  const url = `https://github.com/${gh.repo || board.repo}/issues/${issue.number}`;

  const num = document.createElement('a');
  num.className = 'num';
  num.href = url;
  num.target = '_blank';
  num.rel = 'noreferrer';
  num.textContent = '#' + issue.number;

  const title = document.createElement('a');
  title.className = 'rt';
  title.href = url;
  title.target = '_blank';
  title.rel = 'noreferrer';
  title.textContent = issue.title || '';
  title.title = issue.title || '';

  const tags = document.createElement('span');
  tags.className = 'tags';
  const chip = (text, cls, tip) => {
    const s = document.createElement('span');
    s.className = 'tag ' + (cls || '');
    s.textContent = text;
    if (tip) s.title = tip;
    tags.append(s);
    return s;
  };

  if (job) {
    const b = document.createElement('button');
    b.className = 'tag on';
    b.textContent = isShipped(job) ? 'shipped' : job.stage;
    b.title = `on the board as ${job.id} — open its files`;
    b.onclick = () => openJob(job);
    tags.append(b);
  }

  /* Why it is not ready, most specific first. An open issue it waits on is a
     fact; a prerequisite note is the issue's own words, shown verbatim. */
  if (issue.blockedBy && issue.blockedBy.length) {
    chip('needs ' + issue.blockedBy.map(n => '#' + n).join(' '), 't-blocked',
      'these issues are still open, and this one says they must land first');
  } else if (issue.blockedReason) {
    /* Show the issue's own stated reason, not the word "blocked" - "not
       startable on a Windows dev box" is the whole answer for #172. */
    const why = issue.blockedReason.replace(/^(prerequisites?|blocked by|depends on)\b[\s—–:-]*/i, '');
    chip(why.length > 38 ? why.slice(0, 37) + '…' : (why || 'blocked'),
      't-blocked', issue.blockedReason);
  }
  if (issue.tier === 'epic') {
    chip('epic', 't-epic', 'explicit epic markers — split before opening a job');
  }
  /* A hint, never a demotion: a labelled issue stays ready. */
  if (issue.missing && issue.missing.length) {
    chip('no ' + issue.missing.map(m => MISSING_LABEL[m] || m).join(' / '),
      issue.tier === 'ready' ? 'soft' : 't-groom',
      'the spec-writer builds from Goal, Files and Acceptance Criteria');
  }
  for (const l of (issue.labels || [])
    .filter(l => l !== (gh.label || 'ready-for-dev') && !/^phase-\d/.test(l))
    .slice(0, 2)) chip(l);
  if (issue.milestone) chip(issue.milestone, 'ms');

  row.append(num, title, tags);
  return row;
}

/* ---------- shipped (merged on GitHub) ---------- */

const SHIP_LIMIT = 18;

function renderShipped(shippedJobs, factoryMerged) {
  const all = gh.merged || [];
  /* Every merged PR in the repo is mostly dependabot, so cap the wide view -
     the point of this rail is what shipped lately, not a merge archive. */
  const scoped = shipScope === 'all' ? all : factoryMerged;
  const pool = scoped.slice(0, SHIP_LIMIT);
  const hidden = scoped.length - pool.length;
  const section = document.getElementById('shipped');
  section.hidden = !pool.length && !shippedJobs.length;

  for (const b of document.getElementById('shipToggle').children) {
    b.setAttribute('aria-pressed', b.dataset.scope === shipScope);
    b.textContent = b.dataset.scope === 'all' ? `all (${all.length})`
      : `factory (${factoryMerged.length})`;
  }

  /* A merged PR with a board job renders as the job card, so the review trail
     and its files stay one click away. One without - the job was cleaned up, or
     a human opened the PR - renders as the PR alone. */
  const claimed = new Set();
  const cards = [];
  for (const job of shippedJobs) {
    const pr = mergedPR(job);
    if (pr && !pool.includes(pr)) continue;
    if (pr) claimed.add(pr.number);
    cards.push({ at: pr ? pr.mergedAt : job.started, el: card(job) });
  }
  for (const pr of pool) {
    if (!claimed.has(pr.number)) cards.push({ at: pr.mergedAt, el: prCard(pr) });
  }
  cards.sort((a, b) => String(b.at || '').localeCompare(String(a.at || '')));
  const els = cards.map(c => c.el);
  if (hidden > 0) {
    const more = document.createElement('p');
    more.className = 'empty';
    more.style.flex = '1 1 100%';
    more.textContent = `… ${hidden} older merged PR${hidden === 1 ? '' : 's'} not shown`;
    els.push(more);
  }
  document.getElementById('shippedCards').replaceChildren(...els);
}

for (const b of document.getElementById('shipToggle').children) {
  b.onclick = () => { shipScope = b.dataset.scope; render(); };
}

function prCard(pr) {
  const el = document.createElement('a');
  el.className = 'card';
  el.href = pr.url;
  el.target = '_blank';
  el.rel = 'noreferrer';
  el.innerHTML = `<div class="id">${esc(pr.branch || '')}</div>
    <div class="title">${esc(pr.title || '')}</div>`;
  el.append(prFooter(pr, true, false));
  return el;
}

function prFooter(pr, merged, linked) {
  const f = document.createElement('div');
  f.className = 'pr';
  const label = `PR #${esc(pr.number)}`;
  const bits = [linked && pr.url
    ? `<a class="n" href="${esc(pr.url)}" target="_blank" rel="noreferrer">${label}</a>`
    : `<span class="n">${label}</span>`];
  if (merged) {
    if (pr.mergeCommit) bits.push(`<span>${esc(pr.mergeCommit)}</span>`);
    if (pr.additions != null) {
      bits.push(`<span class="diff"><span class="add">+${pr.additions}</span>`
        + ` <span class="del">-${pr.deletions}</span></span>`);
    }
    bits.push(`<span class="when" title="${esc(pr.mergedAt || '')}">merged ${ago(pr.mergedAt)}</span>`);
  } else {
    bits.push(`<span class="checks ${esc(pr.checks)}">checks ${esc(pr.checks)}</span>`);
    if (pr.mergeable === 'CONFLICTING') {
      bits.push('<span class="checks CONFLICTING">conflicts</span>');
    }
    bits.push(`<span class="when" title="${esc(pr.created || '')}">opened ${ago(pr.created)}</span>`);
  }
  f.innerHTML = bits.join('');
  return f;
}

/* The card body is one button that opens the drawer; the PR footer sits outside
   it, because a link nested in a button is neither valid nor reachable by
   keyboard. */
function card(job) {
  const el = document.createElement('div');
  el.className = 'card';

  const main = document.createElement('button');
  main.className = 'cardmain';
  main.onclick = () => openJob(job);
  main.innerHTML = `<div class="id">${esc(job.id)}</div>
    <div class="title">${esc(job.title || '')}</div>
    <div class="branch">${esc(job.branch || 'no branch yet')}</div>`;

  for (const h of job.history || []) main.append(roundRow(h.round, h.reviews, true));
  if (job.reviews) main.append(roundRow(job.round || 1, job.reviews, false));

  if (job.blockedBy) {
    const b = document.createElement('div');
    b.className = 'blocked';
    b.textContent = `waiting on ${job.blockedBy}`;
    main.append(b);
  }

  if (job.decision || job.note) {
    const n = document.createElement('div');
    n.className = 'note';
    n.textContent = [job.decision, job.note].filter(Boolean).join(' — ');
    main.append(n);
  }
  el.append(main);

  /* Prefer what GitHub says over what the board recorded - the board cannot
     know that a human merged the PR. */
  const done = mergedPR(job), live = openPR(job);
  if (done || live) el.append(prFooter(done || live, !!done, true));
  else if (job.pr) el.append(prFooter(prFromUrl(job.pr), job.stage === 'merged', true));

  /* Issues filed from this job's deferred findings. Without these the findings
     only ever existed in a gitignored folder. */
  if ((job.followups || []).length) el.append(followupRow(job.followups));
  return el;
}

function followupRow(numbers) {
  const row = document.createElement('div');
  row.className = 'pr follow';
  const repo = gh.repo || board.repo;
  row.append(document.createTextNode(
    `${numbers.length} follow-up${numbers.length === 1 ? '' : 's'}`));
  for (const n of numbers) {
    const a = document.createElement('a');
    a.href = `https://github.com/${repo}/issues/${n}`;
    a.target = '_blank';
    a.rel = 'noreferrer';
    a.textContent = '#' + n;
    row.append(a);
  }
  return row;
}

/* A board that recorded a PR url but no GitHub snapshot to match it against. */
function prFromUrl(url) {
  return { number: (url.match(/\/pull\/(\d+)/) || [])[1] || '?', url, checks: 'none' };
}

function roundRow(n, reviews, past) {
  const row = document.createElement('div');
  row.className = 'round' + (past ? ' past' : '');
  row.innerHTML = `<span class="rn">r${n}</span>` + REVIEWERS.map(k => {
    const v = (reviews || {})[k] || 'pending';
    return `<span class="chip ${v}" title="${k}: ${v}">${k}</span>`;
  }).join('');
  return row;
}

/* ---------- drawer ---------- */

async function openJob(job) {
  open = job;
  document.getElementById('dTitle').textContent = job.id;

  const meta = document.getElementById('dMeta');
  meta.replaceChildren();
  if (job.issue && board.repo) {
    const a = document.createElement('a');
    a.href = `https://github.com/${board.repo}/issues/${job.issue}`;
    a.target = '_blank';
    a.rel = 'noreferrer';
    a.textContent = `#${job.issue}`;
    meta.append(a, document.createTextNode('  ·  '));
  }
  meta.append(document.createTextNode(
    [job.branch, job.worktree].filter(Boolean).join('  ·  ') || 'no branch or worktree yet'));
  document.getElementById('scrim').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer').setAttribute('aria-hidden', 'false');
  document.getElementById('doc').textContent = 'loading…';

  const paths = ['spec.md', 'build.md'];
  for (let r = 1; r <= (job.round || 1); r++) {
    if (r > 1) paths.push(`rework-${r}.md`);
    for (const k of REVIEWERS) paths.push(`round-${r}/review-${k}.md`);
  }
  paths.push('decision.md');

  const found = (await Promise.all(paths.map(async p => {
    try {
      const r = await fetch(`jobs/${job.id}/${p}?t=` + Date.now(), { cache: 'no-store' });
      return r.ok ? { path: p, text: await r.text() } : null;
    } catch { return null; }
  }))).filter(Boolean);

  const tabs = document.getElementById('tabs');
  tabs.replaceChildren(...found.map(f => {
    const b = document.createElement('button');
    b.textContent = f.path;
    b.onclick = () => {
      [...tabs.children].forEach(c => c.setAttribute('aria-selected', c === b));
      document.getElementById('doc').innerHTML = md(f.text);
    };
    return b;
  }));
  if (found.length) tabs.firstChild.click();
  else document.getElementById('doc').textContent = 'No files written yet.';
}

function closeJob() {
  open = null;
  document.getElementById('scrim').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer').setAttribute('aria-hidden', 'true');
}
document.getElementById('close').onclick = closeJob;
document.getElementById('scrim').onclick = closeJob;
addEventListener('keydown', e => { if (e.key === 'Escape') closeJob(); });

/* ---------- a small markdown subset ---------- */

const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const span = s => esc(s)
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

function md(src) {
  const lines = src.replace(/\r/g, '').split('\n');
  let out = '', list = null, fence = null, table = null;

  const head = lines[0].trim();
  const m = head.match(/^(VERDICT:\s*)?(PASS|CHANGES|APPROVE|ESCALATE)$/);
  if (m) {
    const good = /PASS|APPROVE/.test(m[2]);
    out += `<div class="badge ${good ? 'good' : 'bad'}">${head}</div>`;
    lines.shift();
  }
  let para = [];
  const shut = () => {
    if (para.length) { out += `<p>${span(para.join(' '))}</p>`; para = []; }
    if (list) { out += `</${list}>`; list = null; }
    if (table) { out += '</table>'; table = null; }
  };

  for (const raw of lines) {
    const line = raw.trimEnd();
    if (/^\s*```/.test(line)) {
      if (fence === null) { shut(); fence = ''; } else { out += `<pre><code>${esc(fence)}</code></pre>`; fence = null; }
      continue;
    }
    if (fence !== null) { fence += raw + '\n'; continue; }

    let t;
    if ((t = line.match(/^(#{1,6})\s+(.*)$/))) {
      shut(); out += `<h${t[1].length}>${span(t[2])}</h${t[1].length}>`;
    } else if (/^\|.*\|$/.test(line)) {
      if (/^\|[\s:|-]+\|$/.test(line)) continue;
      const cells = line.split('|').slice(1, -1);
      const tag = table ? 'td' : 'th';
      if (!table) { shut(); out += '<table>'; table = 1; }
      out += '<tr>' + cells.map(c => `<${tag}>${span(c.trim())}</${tag}>`).join('') + '</tr>';
    } else if ((t = line.match(/^\s*([-*])\s+(.*)$/))) {
      if (table) shut();
      if (list !== 'ul') { shut(); out += '<ul>'; list = 'ul'; }
      out += `<li>${span(t[2])}</li>`;
    } else if ((t = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      if (table) shut();
      if (list !== 'ol') { shut(); out += '<ol>'; list = 'ol'; }
      out += `<li>${span(t[1])}</li>`;
    } else if (!line.trim()) {
      shut();
    } else {
      if (list || table) shut();
      para.push(line.trim());
    }
  }
  shut();
  if (fence !== null) out += `<pre><code>${esc(fence)}</code></pre>`;
  return out;
}

poll();
pollGitHub();
